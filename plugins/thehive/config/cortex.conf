# Cortex configuration
play.http.secret.key = "changeme-soc-deploy-framework-cortex-secret-key-123456789"

search.uri = "http://elasticsearch-cortex:9200"

analyzer {
  urls = ["https://download.thehive-project.org/analyzers.json"]
  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}

responder {
  urls = ["https://download.thehive-project.org/responders.json"]
}

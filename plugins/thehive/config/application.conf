# TheHive 5 minimal configuration
play.http.secret.key = "changeme-soc-deploy-framework-thehive-secret-key-123456789"

db.janusgraph {
  storage {
    backend = cql
    hostname = ["cassandra"]
    cql {
      cluster-name = thehive
      keyspace = thehive
      read-consistency-level = ONE
      write-consistency-level = ONE
    }
  }
}

storage {
  provider = s3
  s3 {
    endpoint = "http://minio:9000"
    bucket = "thehive"
    access-key = "thehive"
    secret-key = "secret123"
    region = "us-east-1"
  }
}

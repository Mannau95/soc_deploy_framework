version: '3.7'

services:
  generator:
    image: wazuh/wazuh-certs-generator:0.0.1
    hostname: wazuh-certs-generator
    volumes:
      - ./config.yml:/etc/wazuh-certs-generator/config.yml
      - wazuh-indexer-cert:/etc/wazuh-certs-generator/certs/indexer
      - wazuh-manager-cert:/etc/wazuh-certs-generator/certs/manager
      - wazuh-dashboard-cert:/etc/wazuh-certs-generator/certs/dashboard

volumes:
  wazuh-indexer-cert:
  wazuh-manager-cert:
  wazuh-dashboard-cert:
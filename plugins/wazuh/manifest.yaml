name: wazuh
version: "4.14.0"
description: "Wazuh SIEM (single-node officiel)"
modes:
  single-node:
    description: "Indexer + Manager + Dashboard"
    prerequisites:
      docker: true
      ports: [443, 55000, 1514, 1515, 1516]
    templates:
      - docker-compose.yml.j2
    post_install:
      healthcheck:
        type: command
        command: "docker exec $(docker ps -qf 'name=wazuh.dashboard') curl -f -k https://localhost:5601"
        expected_stdout: ""
        timeout: 30
        retries: 30
        interval: 10
name: wazuh
version: "4.14.0"
description: "Wazuh SIEM (single-node Docker officiel)"
modes:
  single-node:
    description: "Indexer + Manager + Dashboard en conteneurs"
    prerequisites:
      docker: true
      ports: [443, 55000, 1514, 1515, 1516]
    templates:
      - docker-compose.yml.j2
    post_install:
      healthcheck:
        type: http
        url: "https://localhost"
        expected_status: 200
        timeout: 30
        retries: 40
        interval: 15
name: wazuh
version: "4.14.0"
description: "Wazuh SIEM (installation rapide officielle)"
modes:
  auto-install:
    description: "Déploiement tout-en-un automatisé par le script officiel"
    prerequisites:
      docker: true
    templates: []               # pas de template docker-compose
    post_install:
      healthcheck:
        type: http
        url: "https://localhost"
        expected_status: 200
        timeout: 30
        retries: 40
        interval: 15
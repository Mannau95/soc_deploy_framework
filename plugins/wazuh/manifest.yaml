name: wazuh
version: "4.7.5"
description: "Wazuh SIEM (all-in-one pour MVP)"
modes:
  single-node:
    description: "All-in-one : un seul conteneur indexer+manager+dashboard"
    prerequisites:
      docker: true
      ports: [443, 1514, 1515, 55000]
    templates:
      - docker-compose.yml.j2
    post_install:
      healthcheck:
        type: http
        url: "https://localhost"
        expected_status: 200
        timeout: 120
        retries: 15
        interval: 10
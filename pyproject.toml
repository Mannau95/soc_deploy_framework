[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "socdeploy"
version = "0.1.0"
description = "SOC Deploy Framework - Déploiement automatisé d'outils SOC open source"
authors = [{ name = "SOC Deploy Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
    "Jinja2>=3.1.0",
    "docker>=7.0.0",
    "requests>=2.31.0",
    "loguru>=0.7.0",
    "questionary>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
socdeploy = "socdeploy.cli:app"

[tool.setuptools.packages.find]
include = ["socdeploy*"]
